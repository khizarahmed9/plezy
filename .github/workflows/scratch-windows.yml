name: Scratch Windows build
on:
  push:
    branches: [scratch-1-windows-build]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.47.1"
          cache: true
      - shell: pwsh
        run: flutter pub get --enforce-lockfile --no-example
      - shell: pwsh
        run: |
          flutter precache --windows
          .\windows\tool\install-patched-engine.ps1
      - shell: pwsh
        run: flutter build windows --release
      - shell: pwsh
        run: Test-Path build/windows/x64/runner/Release/plezy.exe
